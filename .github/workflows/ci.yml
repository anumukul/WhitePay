name: Baseline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @whitepay/docs test
      - run: pnpm --filter @whitepay/docs build
      - run: pnpm --filter @whitepay/docs exec playwright install --with-deps chromium
      - run: pnpm --filter @whitepay/docs test:browser
      - run: pnpm --filter @whitepay/website test
      - run: pnpm --filter @whitepay/website build
      - run: pnpm --filter @whitepay/website test:browser
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: whitepay_test
          POSTGRES_PASSWORD: whitepay_test
          POSTGRES_DB: whitepay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whitepay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://whitepay_test:whitepay_test@127.0.0.1:5432/whitepay_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: bash scripts/vendor-oz.sh
      - run: pnpm build:checkout
      - run: pnpm --filter @whitepay/node build
      - run: pnpm --filter @whitepay/react build
      - run: pnpm --filter @whitepay/api --filter @whitepay/node --filter @whitepay/dashboard --filter @whitepay/relayer --filter @whitepay/worker --filter @whitepay/react typecheck
      - run: pnpm --filter @whitepay/api --filter @whitepay/node --filter @whitepay/dashboard --filter @whitepay/relayer --filter @whitepay/worker --filter @whitepay/react test

      - run: pnpm --filter @whitepay/node test:package
      - run: pnpm --filter @whitepay/react exec playwright install --with-deps chromium
      - run: pnpm --filter @whitepay/react test:browser
      - run: pnpm --filter @whitepay/react exec tsc -p tsconfig.operator.json --noEmit
      - run: pnpm --filter @whitepay/dashboard build
      - run: pnpm --filter @whitepay/dashboard test:browser

      - run: pnpm --filter @whitepay/demo-saas typecheck
      - run: pnpm --filter @whitepay/demo-saas test
      - run: pnpm --filter @whitepay/demo-saas build
      - run: pnpm --filter @whitepay/demo-saas test:browser
