[profile.default]
src = "poc"
script = "script/poc"
test = "test/poc"
out = "out"
cache_path = "cache"
allow_paths = ["../../node_modules"]
solc = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/"]

[fuzz]
runs = 256

# Opt-in local execution against official chain state; never broadcasts.
[profile.fork]
test = "test/fork"

# Step 03 production contract build and tests. Uses vendored OZ in lib/
# to sidestep OneDrive/Windows case-sensitivity on cross-package relative paths.
[profile.step03]
src = "src"
script = "script"
test = "test/unit"
out = "out-step03"
cache_path = "cache-step03"
remappings = ["@openzeppelin/contracts/=lib/@openzeppelin/contracts/"]
solc = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.step03.fuzz]
runs = 256

# Final checkout validation against pinned official-token state. Local execution only.
[profile.step03fork]
src = "src"
script = "script"
test = "test/checkout-fork"
out = "out-step03"
cache_path = "cache-step03"
remappings = ["@openzeppelin/contracts/=lib/@openzeppelin/contracts/"]
via_ir = true
